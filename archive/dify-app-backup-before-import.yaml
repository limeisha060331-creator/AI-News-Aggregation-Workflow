    - data:
        code: "import json\nimport re\nimport xml.etree.ElementTree as ET\nfrom urllib.parse\
          \ import parse_qsl, urlencode, urlsplit, urlunsplit\n\nTOP_N = 15\nATOM\
          \ = \"{http://www.w3.org/2005/Atom}\"\nDROP_KEYS = {\"ref\", \"fbclid\"\
          , \"gclid\", \"spm\", \"from\", \"source\", \"share_token\"}\nENTITIES =\
          \ (\n    (\"&nbsp;\", \" \"), (\"&amp;\", \"&\"), (\"&lt;\", \"<\"),\n \
          \   (\"&gt;\", \">\"), (\"&quot;\", '\"'), (\"&#39;\", \"'\"),\n)\n\n\n\
          def normalize_url(raw: str) -> str:\n    if not raw:\n        return \"\"\
          \n    raw = raw.strip()\n    try:\n        parts = urlsplit(raw)\n    except\
          \ Exception:\n        return raw\n    host = (parts.hostname or \"\").lower()\n\
          \    if not host:\n        return raw\n    query = []\n    for key, value\
          \ in parse_qsl(parts.query, keep_blank_values=False):\n        low = key.lower()\n\
          \        if low.startswith(\"utm_\") or low in DROP_KEYS:\n            continue\n\
          \        query.append((key, value))\n    path = parts.path.rstrip(\"/\"\
          ) or \"/\"\n    return urlunsplit((\"https\", host, path, urlencode(query),\
          \ \"\"))\n\n\ndef clean_text(value) -> str:\n    text = value or \"\"\n\
          \    text = re.sub(r\"<[^>]+>\", \" \", text)\n    for src, dst in ENTITIES:\n\
          \        text = text.replace(src, dst)\n    return re.sub(r\"\\s+\", \"\
          \ \", text).strip()\n\n\ndef parse_rss(xml_text: str, source: str, weight:\
          \ int) -> list:\n    items = []\n    if not xml_text:\n        return items\n\
          \    try:\n        root = ET.fromstring(xml_text.strip())\n    except Exception:\n\
          \        return items\n    for node in root.iter(\"item\"):\n        title\
          \ = clean_text(node.findtext(\"title\"))\n        link = (node.findtext(\"\
          link\") or \"\").strip()\n        if not title or not link:\n          \
          \  continue\n        items.append({\n            \"title\": title,\n   \
          \         \"url\": link,\n            \"origin\": source,\n            \"\
          weight\": weight,\n            \"score\": 0,\n            \"published\"\
          : (node.findtext(\"pubDate\") or \"\").strip(),\n            \"raw\": clean_text(node.findtext(\"\
          description\"))[:400],\n        })\n    for node in root.iter(ATOM + \"\
          entry\"):\n        title = clean_text(node.findtext(ATOM + \"title\"))\n\
          \        link_node = node.find(ATOM + \"link\")\n        link = link_node.get(\"\
          href\") if link_node is not None else \"\"\n        if not title or not\
          \ link:\n            continue\n        items.append({\n            \"title\"\
          : title,\n            \"url\": link.strip(),\n            \"origin\": source,\n\
          \            \"weight\": weight,\n            \"score\": 0,\n          \
          \  \"published\": (node.findtext(ATOM + \"updated\") or \"\").strip(),\n\
          \            \"raw\": clean_text(node.findtext(ATOM + \"summary\"))[:400],\n\
          \        })\n    return items\n\n\ndef parse_hn(body: str) -> list:\n  \
          \  items = []\n    if not body:\n        return items\n    try:\n      \
          \  payload = json.loads(body)\n    except Exception:\n        return items\n\
          \    for hit in payload.get(\"hits\", []):\n        title = clean_text(hit.get(\"\
          title\"))\n        if not title:\n            continue\n        url = hit.get(\"\
          url\") or (\n            \"https://news.ycombinator.com/item?id=\" + str(hit.get(\"\
          objectID\", \"\"))\n        )\n        items.append({\n            \"title\"\
          : title,\n            \"url\": url,\n            \"origin\": \"HN\",\n \
          \           \"weight\": 3,\n            \"score\": int(hit.get(\"points\"\
          ) or 0),\n            \"published\": hit.get(\"created_at\") or \"\",\n\
          \            \"raw\": clean_text(hit.get(\"story_text\"))[:400],\n     \
          \   })\n    return items\n\n\ndef main(hn_body: str, openai_body: str, jqzx_body:\
          \ str, history_urls: str) -> dict:\n    hn_items = parse_hn(hn_body)\n \
          \   openai_items = parse_rss(openai_body, \"OpenAI Blog\", 5)\n    jqzx_items\
          \ = parse_rss(jqzx_body, \"机器之心\", 4)\n\n    blocked = set()\n    for line\
          \ in (history_urls or \"\").splitlines():\n        key = normalize_url(line)\n\
          \        if key:\n            blocked.add(key)\n\n    kept = []\n    seen\
          \ = set()\n    for item in hn_items + openai_items + jqzx_items:\n     \
          \   key = normalize_url(item[\"url\"])\n        if not key or key in seen\
          \ or key in blocked:\n            continue\n        seen.add(key)\n    \
          \    item[\"url\"] = key\n        kept.append(item)\n\n    kept.sort(key=lambda\
          \ row: (row[\"weight\"], row[\"score\"]), reverse=True)\n    kept = kept[:TOP_N]\n\
          \    for index, item in enumerate(kept):\n        item[\"index\"] = index\n\
          \n    merged = len(hn_items) + len(openai_items) + len(jqzx_items)\n   \
          \ stats = {\n        \"hn_raw\": len(hn_items),\n        \"openai_raw\"\
          : len(openai_items),\n        \"jqzx_raw\": len(jqzx_items),\n        \"\
          merged_raw\": merged,\n        \"after_url_dedup\": len(kept),\n       \
          \ \"dropped\": max(0, merged - len(kept)),\n    }\n    return {\n      \
          \  \"items\": kept,\n        \"items_json\": json.dumps(kept, ensure_ascii=False),\n\
          \        \"stats\": json.dumps(stats, ensure_ascii=False),\n    }\n"
        code_language: python3
        desc: ''
