    nodes:
    - data:
        code: "import datetime\nimport json\nimport re\n\nTOP_N = 12\n\n\ndef strip_fence(text:\
          \ str) -> str:\n    body = (text or \"\").strip()\n    if body.startswith(\"\
          ```\"):\n        body = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\", body)\n   \
          \     body = re.sub(r\"\\s*```$\", \"\", body)\n    return body.strip()\n\
          \n\ndef today_in_beijing() -> str:\n    import time\n    return time.strftime(\"\
          %Y-%m-%d\", time.gmtime(time.time() + 8 * 3600))\n\ndef main(items: list,\
          \ llm_text: str) -> dict:\n    analyses = {}\n    try:\n        parsed =\
          \ json.loads(strip_fence(llm_text))\n        for row in parsed.get(\"items\"\
          , []):\n            try:\n                analyses[int(row.get(\"index\"\
          ))] = row\n            except (TypeError, ValueError):\n               \
          \ continue\n    except Exception:\n        analyses = {}\n\n    run_date\
          \ = today_in_beijing()\n    picked = []\n    for item in items or []:\n\
          \        row = analyses.get(item.get(\"index\")) or {}\n        if row.get(\"\
          keep\") is False:\n            continue\n        summary = (row.get(\"summary_zh\"\
          ) or \"\").strip()\n        title = (row.get(\"title_zh\") or \"\").strip()\
          \ or item.get(\"title\", \"\")\n        picked.append({\n            \"\
          title\": title,\n            \"url\": item.get(\"url\", \"\"),\n       \
          \     \"origin\": item.get(\"origin\", \"\"),\n            \"summary\":\
          \ summary or (item.get(\"raw\") or \"\")[:120],\n        })\n\n    picked\
          \ = picked[:TOP_N]\n    sources = \" / \".join(sorted({row[\"origin\"] for\
          \ row in picked if row[\"origin\"]}))\n    lines = [\n        \"# AI 日报\
          \ · \" + run_date,\n        \"\",\n        \"共 %d 条 · 来源：%s\" % (len(picked),\
          \ sources or \"无\"),\n        \"\",\n    ]\n    for index, row in enumerate(picked,\
          \ 1):\n        lines.append(\"## %d. %s\" % (index, row[\"title\"]))\n \
          \       if row[\"summary\"]:\n            lines.append(row[\"summary\"])\n\
          \        lines.append(\"来源：%s · [原文](%s)\" % (row[\"origin\"], row[\"url\"\
          ]))\n        lines.append(\"\")\n    markdown = \"\\n\".join(lines).strip()\n\
          \n    payload = {\n        \"msg_type\": \"interactive\",\n        \"card\"\
          : {\n            \"config\": {\"wide_screen_mode\": True},\n           \
          \ \"header\": {\n                \"template\": \"blue\",\n             \
          \   \"title\": {\"tag\": \"plain_text\", \"content\": \"AI 日报 · \" + run_date},\n\
          \            },\n            \"elements\": [\n                {\"tag\":\
          \ \"div\", \"text\": {\"tag\": \"lark_md\", \"content\": markdown}}\n  \
          \          ],\n        },\n    }\n\n    return {\n        \"markdown\":\
          \ markdown,\n        \"feishu_payload\": json.dumps(payload, ensure_ascii=False),\n\
          \        \"pushed_urls\": [row[\"url\"] for row in picked],\n        \"\
          count\": len(picked),\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          count:
            children: null
            type: number
          feishu_payload:
            children: null
            type: string
          markdown:
            children: null
            type: string
          pushed_urls:
            children: null
            type: array[string]
