    - data:
        desc: 直接采用 LLM 写好的日报 Markdown，抽出其中真正引用到的链接交给调度器做跨天去重。LLM 输出不可用时按来源权重保底渲染一份，避免推空消息。推送不在这里做，见 scheduler/run_daily.py。
        code: |
          import datetime
          import re

          # 分档标题：出现两个以上才认为模型真的按格式写了日报
          SECTION_KEYWORDS = ("今日头条", "重要进展", "值得关注", "链接汇总")

          # 抓日报里的链接：markdown 链接、<url>、裸链接都能命中
          URL_RE = re.compile(r"https?://[^\s)\]>（），。；、\"']+")
          # 末尾的反斜杠是模型在 markdown 里转义右括号留下的（.../ \)），不剥掉会污染去重 key
          TRAILING_CHARS = ".,;:!?、。；：！？\\"

          FALLBACK_TOP_N = 12


          def strip_wrappers(text: str) -> str:
              """丢掉推理块、HTML 注释，以及模型给整篇日报套上的 markdown 围栏。"""
              body = (text or "").strip()
              body = re.sub(r"(?is)<think>.*?</think>", " ", body)
              body = re.sub(r"(?is)<!--.*?-->", " ", body)
              body = body.strip()
              if body.startswith("```"):
                  body = re.sub(r"^```[a-zA-Z]*[ \t]*\r?\n", "", body)
                  body = re.sub(r"\r?\n?```[ \t]*$", "", body)
              # 模型常把链接写成 [原文](https://.../\)，转义出来的反斜杠会让链接点开 404
              body = re.sub(r"(https?://[^\s)]*?)\\\)", r"\1)", body)
              return body.strip()


          def extract_urls(markdown: str) -> list:
              """按出现顺序取出日报引用到的链接，重复的只保留一次。"""
              seen, urls = set(), []
              for raw in URL_RE.findall(markdown or ""):
                  url = raw.rstrip(TRAILING_CHARS)
                  if url and url not in seen:
                      seen.add(url)
                      urls.append(url)
              return urls


          def looks_like_report(markdown: str) -> bool:
              """模型写了分档日报，而不是报错、道歉或者 JSON。"""
              if not markdown.strip() or not extract_urls(markdown):
                  return False
              return sum(1 for word in SECTION_KEYWORDS if word in markdown) >= 2


          def today_in_beijing() -> str:
              now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
              return now.strftime("%Y-%m-%d")


          def importance_of(row: dict) -> int:
              """保底渲染时没有 LLM 评分，用来源权重当重要性近似值。"""
              try:
                  weight = int(row.get("weight") or 3)
              except (TypeError, ValueError):
                  weight = 3
              return min(5, max(1, weight))


          def fallback_markdown(items: list, run_date: str, reason: str) -> str:
              """LLM 输出不可用时用 code_parse 的结果拼保底日报，宁可朴素也不能推空消息。"""
              rows = [row for row in (items or []) if isinstance(row, dict) and row.get("url")]
              rows.sort(key=lambda row: (row.get("weight") or 0, row.get("score") or 0), reverse=True)
              rows = rows[:FALLBACK_TOP_N]

              sources = " / ".join(sorted({row.get("origin") or "" for row in rows if row.get("origin")}))
              lines = [
                  "# AI 日报 · " + run_date,
                  "",
                  "> 共 %d 条 · 来源：%s" % (len(rows), sources or "无"),
                  "",
                  "<!-- 保底渲染（%s）：LLM 这次没给出可用的日报正文 -->" % reason,
                  "",
              ]
              for name, group in (("今日头条", rows[:1]), ("重要进展", rows[1:3]), ("值得关注", rows[3:])):
                  lines.append("## " + name)
                  lines.append("")
                  if not group:
                      lines.append("今日无")
                      lines.append("")
                      continue
                  for row in group:
                      lines.append("### %s · 重要性 %d/5" % (row.get("title") or "(无标题)", importance_of(row)))
                      lines.append((row.get("raw") or "").strip() or "（摘要缺失，仅保留标题与链接）")
                      lines.append("来源：%s · [原文](%s)" % (row.get("origin") or "", row.get("url")))
                      lines.append("")
              lines.append("## 链接汇总")
              lines.append("")
              for row in rows:
                  lines.append("- [%s](%s) — %s · %d/5" % (
                      row.get("title") or "(无标题)", row.get("url"), row.get("origin") or "", importance_of(row),
                  ))
              return "\n".join(lines).strip()


          def main(llm_markdown: str, items: list, run_date: str = "") -> dict:
              date = (run_date or "").strip() or today_in_beijing()

              report = strip_wrappers(llm_markdown)
              if not looks_like_report(report):
                  reason = "输出为空" if not report else "输出不是分档日报"
                  report = fallback_markdown(items, date, reason)

              urls = extract_urls(report)
              # 让链接回到 code_parse 的归一化形式：跨天去重就是拿这个 key 比对的，
              # 模型多写一个尾斜杠，第二天就会把同一条再推一遍。
              canonical = {}
              for row in items or []:
                  if isinstance(row, dict) and row.get("url"):
                      canonical[row["url"].rstrip("/")] = row["url"]
              urls = list(dict.fromkeys(canonical.get(url.rstrip("/"), url) for url in urls))
              if not urls:
                  urls = [row.get("url") for row in (items or []) if isinstance(row, dict) and row.get("url")]

              # 把链接映射回条目，交给调度脚本写进本地库：语义去重要靠历史标题比对，
              # 只存 URL 的话第二天没有文本可比，语义去重直接失效
              by_url = {}
              for row in items or []:
                  if isinstance(row, dict) and row.get("url"):
                      by_url[row["url"]] = row
              pushed_items = []
              for url in urls:
                  row = by_url.get(url) or {}
                  pushed_items.append({
                      "url": url,
                      "title": row.get("title") or "",
                      "origin": row.get("origin") or "",
                      "raw": (row.get("raw") or "")[:200],
                  })

              return {
                  "markdown": report,
                  "pushed_urls": urls,
                  "pushed_items": pushed_items,
                  "count": len(urls),
              }
