app:
  description: 从 Hacker News、OpenAI Blog、量子位三个源抓取 AI 资讯，去重后由 LLM 生成中文日报 Markdown（今日头条/重要进展/值得关注，每条带 1-5 重要性评分）并推送。
  icon: 📰
  icon_background: '#EFF1F4'
  mode: workflow
  name: AI 资讯聚合日报
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
