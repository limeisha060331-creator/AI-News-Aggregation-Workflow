    - data:
        desc: 解析 Hacker News 的 JSON：清洗空值、URL 归一化去重、时间格式化，输出 title/url/time/source 结构化列表，供下游 code_parse 消费。
        code: |
          # -*- coding: utf-8 -*-
          """
          Dify 代码节点：解析 Hacker News API 返回的 JSON。

          数据流
              HTTP 请求节点（拉 HN 数据）-> 本节点（清洗 / 去重 / 格式化）-> 结构化列表

          输入
              hn_json          : str | dict | list  HTTP 节点响应体，兼容 Algolia 与 Firebase 两种形状
              tz_offset_hours  : float  输出时间的时区偏移，默认 8（北京时间 UTC+8）
              time_format      : str    strftime 格式，默认 "%Y-%m-%d %H:%M"
              max_items        : int    最多保留多少条，0 表示不限制

          输出（对应 Dify 节点的输出变量）
              stories       : list[dict]  每条必含 title / url / time / source，
                                          另附 id / author / score / comments / text / time_iso / time_unix
              count         : int  列表长度
              skipped       : int  因缺标题或结构非法被丢弃的条数
              deduplicated  : int  被去重合并掉的条数
              error         : str  解析失败原因，正常为空字符串
          """

          import json
          import re
          from datetime import datetime, timedelta, timezone
          from urllib.parse import parse_qsl, urlencode, urlsplit

          # --------------------------------------------------------------------------- 常量

          HN_ITEM_URL = "https://news.ycombinator.com/item?id={id}"
          HN_FALLBACK_SOURCE = "Hacker News"
          DEFAULT_TZ_OFFSET_HOURS = 8.0
          DEFAULT_TIME_FORMAT = "%Y-%m-%d %H:%M"
          MAX_COLLECT_DEPTH = 4

          # 条目列表可能挂在这些字段下（按优先级）
          _LIST_KEYS = ("hits", "stories", "items", "results", "data", "list", "articles")

          _TITLE_KEYS = ("title", "story_title", "name", "headline")
          _URL_KEYS = ("url", "story_url", "link", "permalink", "href")
          _ID_KEYS = ("id", "objectID", "object_id", "story_id")
          _TIME_KEYS = (
              "time",
              "created_at_i",
              "timestamp",
              "published_at",
              "published",
              "date",
              "created_at",
          )
          _AUTHOR_KEYS = ("by", "author", "user", "username")
          _SCORE_KEYS = ("score", "points", "votes")
          _COMMENT_KEYS = ("descendants", "num_comments", "comments_count", "comments")
          _SOURCE_KEYS = ("source", "site", "publisher", "domain")
          _TEXT_KEYS = ("story_text", "text", "description", "summary", "content")

          # 正文截断长度，供下游 LLM 摘要有足够上下文又不超过提示词预算
          TEXT_LIMIT = 400

          # 去重时应当忽略的跟踪参数
          _TRACKING_PARAMS = {
              "utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content",
              "utm_id", "utm_name", "fbclid", "gclid", "igshid", "mc_cid", "mc_eid",
              "ref", "ref_src", "spm",
          }

          _HOST_ALIASES = {
              "x.com": "twitter.com",
              "mobile.twitter.com": "twitter.com",
              "m.twitter.com": "twitter.com",
              "old.reddit.com": "reddit.com",
              "np.reddit.com": "reddit.com",
              "www.reddit.com": "reddit.com",
          }
          _HOST_PREFIXES = ("www.", "m.", "mobile.", "amp.", "web.")

          _WHITESPACE_RE = re.compile(r"\s+")
          _NUMERIC_RE = re.compile(r"^[+-]?\d+(\.\d+)?([eE][+-]?\d+)?$")


          # ----------------------------------------------------------------------- 基础工具


          def _as_text(value):
              """把任意 JSON 标量安全转成字符串；容器 / 布尔 / None 一律视为空。"""
              if value is None or isinstance(value, bool):
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float)):
                  return str(value)
              return ""


          def _clean(value):
              """折叠空白并去掉首尾空格，用于净化 title 之类的文本。"""
              return _WHITESPACE_RE.sub(" ", _as_text(value)).strip()


          def _first_present(item, keys):
              """按候选字段名顺序取第一个非空值。"""
              if not isinstance(item, dict):
                  return ""
              for key in keys:
                  text = _clean(item.get(key))
                  if text:
                      return text
              return ""


          def _to_int(value, default=None):
              if value is None or isinstance(value, bool):
                  return default
              if isinstance(value, int):
                  return value
              if isinstance(value, float):
                  return int(value)
              text = _as_text(value).strip()
              try:
                  return int(float(text))
              except ValueError:
                  return default


          def _to_float(value, default=0.0):
              if value is None or isinstance(value, bool):
                  return default
              if isinstance(value, (int, float)):
                  return float(value)
              text = _as_text(value).strip()
              try:
                  return float(text)
              except ValueError:
                  return default


          def _clip(text, limit=TEXT_LIMIT):
              """把正文截断到指定长度。"""
              return text[:limit] if text else ""


          # ----------------------------------------------------------------------- 时间处理


          def _normalize_epoch(number):
              """把秒 / 毫秒 / 微秒 / 纳秒时间戳统一成秒。"""
              magnitude = abs(number)
              if magnitude >= 1e17:      # 纳秒
                  return number / 1e9
              if magnitude >= 1e14:      # 微秒
                  return number / 1e6
              if magnitude >= 1e11:      # 毫秒
                  return number / 1e3
              return number              # 秒


          def _parse_iso_datetime(text):
              candidate = text.strip()
              if candidate.endswith(("Z", "z")):
                  candidate = candidate[:-1] + "+00:00"
              try:
                  parsed = datetime.fromisoformat(candidate)
              except ValueError:
                  return None
              if parsed.tzinfo is None:          # 无时区信息时按 UTC 处理
                  parsed = parsed.replace(tzinfo=timezone.utc)
              try:
                  return parsed.timestamp()
              except (OSError, OverflowError, ValueError):
                  return None


          def to_unix_seconds(value):
              """epoch 秒 / 毫秒、数字字符串、ISO8601 字符串统一成 Unix 秒；无法识别返回 None。"""
              if value is None or isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return _normalize_epoch(float(value))

              text = _as_text(value).strip()
              if not text:
                  return None
              if _NUMERIC_RE.match(text):
                  return _normalize_epoch(float(text))
              return _parse_iso_datetime(text)


          def format_time(value, tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS, time_format=DEFAULT_TIME_FORMAT):
              """把任意时间表示格式化成字符串；无法识别时返回空字符串。"""
              seconds = to_unix_seconds(value)
              if seconds is None:
                  return ""
              tzinfo = timezone(timedelta(hours=_to_float(tz_offset_hours)))
              try:
                  return datetime.fromtimestamp(seconds, tzinfo).strftime(time_format)
              except (OSError, OverflowError, ValueError):
                  return ""


          def format_time_utc(value):
              """输出 UTC 的 ISO8601（秒级精度，带 Z），便于机器读取。"""
              seconds = to_unix_seconds(value)
              if seconds is None:
                  return ""
              try:
                  moment = datetime.fromtimestamp(seconds, timezone.utc)
              except (OSError, OverflowError, ValueError):
                  return ""
              return moment.strftime("%Y-%m-%dT%H:%M:%SZ")


          # --------------------------------------------------------------------- URL 处理


          def _normalize_host(host):
              """小写化主机名，去掉 www / m / amp 之类前缀并做常见别名归一。"""
              host = (host or "").lower()
              for prefix in _HOST_PREFIXES:
                  if host.startswith(prefix) and len(host) > len(prefix):
                      host = host[len(prefix):]
                      break
              return _HOST_ALIASES.get(host, host)


          def host_of(url):
              """从 URL 中取出用于展示的域名。"""
              text = _clean(url)
              if not text:
                  return ""
              if "//" not in text.split("?", 1)[0]:
                  text = "https://" + text
              return _normalize_host(urlsplit(text).hostname)


          def normalize_url(url):
              """归一化 URL 用于去重：小写主机、补全裸域名、去掉跟踪参数与尾斜杠。"""
              text = _clean(url)
              if not text:
                  return ""
              if "//" not in text.split("?", 1)[0]:
                  text = "https://" + text
              try:
                  parts = urlsplit(text)
              except ValueError:
                  return text.lower().rstrip("/")

              host = _normalize_host(parts.hostname)
              if not host:
                  return text.lower().rstrip("/")

              netloc = host
              try:
                  if parts.port:
                      netloc = "%s:%d" % (host, parts.port)
              except ValueError:
                  pass

              path = parts.path.rstrip("/") or "/"
              query = urlencode(
                  sorted(
                      (key, value)
                      for key, value in parse_qsl(parts.query, keep_blank_values=True)
                      if key.lower() not in _TRACKING_PARAMS
                  )
              )
              normalized = netloc + path
              if query:
                  normalized += "?" + query
              return normalized


          def extract_source(raw_item, url, synthesized=False):
              """
              来源判定优先级：
              1. 数据自带的 source / site / domain 字段
              2. 链接是本地合成的 HN 讨论页（文本贴、Ask HN）-> 记为 Hacker News
              3. 链接域名
              """
              explicit = _first_present(raw_item, _SOURCE_KEYS)
              if explicit:
                  return explicit
              if synthesized:
                  return HN_FALLBACK_SOURCE
              return host_of(url) or HN_FALLBACK_SOURCE


          # -------------------------------------------------------------------- 条目构造


          def build_story(raw_item, tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS, time_format=DEFAULT_TIME_FORMAT):
              """把单条原始数据规范化；缺标题或无法生成链接时返回 None（丢弃）。"""
              if not isinstance(raw_item, dict):
                  return None

              title = _first_present(raw_item, _TITLE_KEYS)
              if not title:
                  return None

              item_id = _first_present(raw_item, _ID_KEYS)
              url = _first_present(raw_item, _URL_KEYS)
              synthesized = not url
              if synthesized:
                  if not item_id:
                      return None                     # 既没链接也没 id，无法生成可点击条目
                  url = HN_ITEM_URL.format(id=item_id)

              raw_time = _first_present(raw_item, _TIME_KEYS)
              seconds = to_unix_seconds(raw_time)

              return {
                  "title": title,
                  "url": url,
                  "time": format_time(raw_time, tz_offset_hours, time_format),
                  "source": extract_source(raw_item, url, synthesized),
                  "id": item_id,
                  "author": _first_present(raw_item, _AUTHOR_KEYS),
                  "score": _to_int(_first_present(raw_item, _SCORE_KEYS)),
                  "comments": _to_int(_first_present(raw_item, _COMMENT_KEYS)),
                  "text": _clip(_first_present(raw_item, _TEXT_KEYS)),
                  "time_iso": format_time_utc(raw_time),
                  "time_unix": int(seconds) if seconds is not None else None,
              }


          def dedupe_key(story):
              """同一条新闻可能有多种链接形态，统一用归一化 URL 做键。"""
              normalized = normalize_url(story["url"])
              if normalized:
                  return "url:" + normalized
              return "title:" + _clean(story["title"]).casefold()


          def _merge_missing(target, extra):
              """重复条目保留先出现的，只补齐 target 中缺失的字段。"""
              # build_story 保证 url 非空，这里同样按“先到先得”补齐其余字段
              for field in ("url", "time", "time_iso", "time_unix", "source", "id", "author", "score", "comments"):
                  if target.get(field) in (None, "") and extra.get(field) not in (None, ""):
                      target[field] = extra[field]


          # ----------------------------------------------------------------- 入口 / 主流程


          def _loads(text):
              try:
                  return json.loads(text)
              except (ValueError, TypeError):
                  return None


          def collect_items(payload, depth=0):
              """从各种响应形状里取出条目列表。"""
              if payload is None or depth > MAX_COLLECT_DEPTH:
                  return []
              if isinstance(payload, str):
                  return collect_items(_loads(payload), depth + 1)
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in _LIST_KEYS:
                      if key in payload:
                          found = collect_items(payload[key], depth + 1)
                          if found:
                              return found
                  values = list(payload.values())
                  if values and all(isinstance(value, dict) for value in values):
                      return values                    # {"123": {...}, "456": {...}} 形式
                  if any(key in payload for key in _TITLE_KEYS + _URL_KEYS + _ID_KEYS):
                      return [payload]                 # 单个条目
              return []


          def parse_hn_json(
              hn_json,
              tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS,
              time_format=DEFAULT_TIME_FORMAT,
              max_items=0,
          ):
              """核心逻辑：清洗 + 去重 + 时间格式化，返回 Dify 节点输出。"""
              limit = _to_int(max_items, 0) or 0
              stories = []
              index = {}
              skipped = 0
              deduplicated = 0

              for raw_item in collect_items(hn_json):
                  if limit and len(stories) >= limit:
                      break
                  story = build_story(raw_item, tz_offset_hours, time_format)
                  if story is None:
                      skipped += 1
                      continue
                  key = dedupe_key(story)
                  existing = index.get(key)
                  if existing is None:
                      index[key] = story
                      stories.append(story)
                  else:
                      deduplicated += 1
                      _merge_missing(existing, story)

              return {
                  "stories": stories,
                  "count": len(stories),
                  "skipped": skipped,
                  "deduplicated": deduplicated,
                  "error": "",
              }


          def main(
              hn_json,
              tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS,
              time_format=DEFAULT_TIME_FORMAT,
              max_items=0,
          ):
              """Dify 代码节点入口，保证不抛异常。"""
              try:
                  return parse_hn_json(hn_json, tz_offset_hours, time_format, max_items)
              except Exception as exc:                                   # noqa: BLE001
                  return {
                      "stories": [],
                      "count": 0,
                      "skipped": 0,
                      "deduplicated": 0,
                      "error": "%s: %s" % (type(exc).__name__, exc),
                  }
        code_language: python3
        outputs:
          stories:
            children: null
            type: array[object]
          count:
            children: null
            type: number
          skipped:
            children: null
            type: number
          deduplicated:
            children: null
            type: number
          error:
            children: null
            type: string
        selected: false
        title: 解析 HN 列表
        type: code
        variables:
        - value_selector:
          - http_hn
          - body
          value_type: string
          variable: hn_json
      height: 54
      id: code_hn
      position:
        x: 334
        y: 460
      positionAbsolute:
        x: 334
        y: 460
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 合并 code_hn 解析好的 HN 列表与两个 RSS 源，跨源 URL 归一化去重，并按历史已推送列表过滤。
        code: |
          import datetime
          import json
          import re
          import xml.etree.ElementTree as ET
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          TOP_N = 15
          MIN_PER_SOURCE = 3
          ATOM = "{http://www.w3.org/2005/Atom}"
          DROP_KEYS = {"ref", "fbclid", "gclid", "spm", "from", "source", "share_token"}
          ENTITIES = (
              ("&nbsp;", " "), ("&amp;", "&"), ("&lt;", "<"),
              ("&gt;", ">"), ("&quot;", '"'), ("&#39;", "'"),
          )


          def normalize_url(raw: str) -> str:
              if not raw:
                  return ""
              raw = raw.strip()
              # 补全协议头：code_hn 产出的 HN 链接不带协议（blog.example.com/x），
              # urlsplit 取不到主机名就会原样返回，最后渲染成相对链接点不开，
              # code_build 的 https?:// 也抽不出来，这类条目会永远进不了历史库
              if "//" not in raw.split("?", 1)[0]:
                  raw = "https://" + raw
              try:
                  parts = urlsplit(raw)
              except Exception:
                  return raw
              host = (parts.hostname or "").lower()
              # www 前缀折叠：HN 常链到 www.example.com，RSS 常给 example.com，
              # 不折叠的话同一条会被当成两条推两遍
              if host.startswith("www.") and len(host) > 4:
                  host = host[4:]
              if not host:
                  return raw
              query = []
              for key, value in parse_qsl(parts.query, keep_blank_values=False):
                  low = key.lower()
                  if low.startswith("utm_") or low in DROP_KEYS:
                      continue
                  query.append((key, value))
              path = parts.path.rstrip("/") or "/"
              return urlunsplit(("https", host, path, urlencode(query), ""))


          def clean_text(value) -> str:
              text = value or ""
              text = re.sub(r"<[^>]+>", " ", text)
              for src, dst in ENTITIES:
                  text = text.replace(src, dst)
              return re.sub(r"\s+", " ", text).strip()


          def looks_like_html(body: str) -> bool:
              """feed 地址失效时常常返回一个网页，这里用来识别这种情况。"""
              head = (body or "").strip()[:200].lower()
              return head.startswith("<!doctype html") or head.startswith("<html")


          def parse_rss(xml_text: str, source: str, weight: int) -> list:
              items = []
              if not xml_text:
                  return items
              try:
                  root = ET.fromstring(xml_text.strip())
              except Exception:
                  return items
              for node in root.iter("item"):
                  title = clean_text(node.findtext("title"))
                  link = (node.findtext("link") or "").strip()
                  if not title or not link:
                      continue
                  items.append({
                      "title": title,
                      "url": link,
                      "origin": source,
                      "weight": weight,
                      "score": 0,
                      "published": (node.findtext("pubDate") or "").strip(),
                      "raw": clean_text(node.findtext("description"))[:400],
                  })
              for node in root.iter(ATOM + "entry"):
                  title = clean_text(node.findtext(ATOM + "title"))
                  link_node = node.find(ATOM + "link")
                  link = link_node.get("href") if link_node is not None else ""
                  if not title or not link:
                      continue
                  items.append({
                      "title": title,
                      "url": link.strip(),
                      "origin": source,
                      "weight": weight,
                      "score": 0,
                      "published": (node.findtext(ATOM + "updated") or "").strip(),
                      "raw": clean_text(node.findtext(ATOM + "summary"))[:400],
                  })
              return items


          def map_hn(stories: list) -> list:
              """把 code_hn 节点输出的结构化列表映射成内部条目结构。"""
              items = []
              for row in stories or []:
                  if not isinstance(row, dict):
                      continue
                  title = clean_text(row.get("title"))
                  url = (row.get("url") or "").strip()
                  if not title or not url:
                      continue
                  items.append({
                      "title": title,
                      "url": url,
                      "origin": "HN",
                      "weight": 3,
                      "score": int(row.get("score") or 0),
                      "published": row.get("time_iso") or row.get("time") or "",
                      "raw": clean_text(row.get("text"))[:400],
                  })
              return items


          def pick_top(rows: list) -> list:
              """按来源限额挑选，避免单个源把版面刷满；名额之外再用高分条目补满。"""
              origins = {row.get("origin") or "?" for row in rows}
              cap = max(MIN_PER_SOURCE, TOP_N // max(1, len(origins)))
              picked, overflow, used = [], [], {}
              for row in rows:
                  origin = row.get("origin") or "?"
                  if used.get(origin, 0) < cap:
                      used[origin] = used.get(origin, 0) + 1
                      picked.append(row)
                  else:
                      overflow.append(row)
              picked.extend(overflow[: max(0, TOP_N - len(picked))])
              return picked[:TOP_N]


          def today_in_beijing() -> str:
              """日报日期统一按北京时间算，避免用 UTC 跑出前一天。"""
              now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)
              return now.strftime("%Y-%m-%d")


          def main(hn_items: list, openai_body: str, qbitai_body: str, history_urls: str) -> dict:
              hn_rows = map_hn(hn_items)
              openai_items = parse_rss(openai_body, "OpenAI Blog", 5)
              qbitai_items = parse_rss(qbitai_body, "量子位", 4)

              blocked = set()
              for line in (history_urls or "").splitlines():
                  key = normalize_url(line)
                  if key:
                      blocked.add(key)

              kept = []
              seen = set()
              for item in hn_rows + openai_items + qbitai_items:
                  key = normalize_url(item["url"])
                  if not key or key in seen or key in blocked:
                      continue
                  seen.add(key)
                  item["url"] = key
                  kept.append(item)

              kept.sort(key=lambda row: (row["weight"], row["score"]), reverse=True)
              deduped_total = len(kept)
              kept = pick_top(kept)
              for index, item in enumerate(kept):
                  item["index"] = index

              merged = len(hn_rows) + len(openai_items) + len(qbitai_items)
              warnings = []
              for label, body in (("OpenAI Blog", openai_body), ("量子位", qbitai_body)):
                  if looks_like_html(body):
                      warnings.append(label + " 返回的是网页不是 RSS，feed 地址可能已经失效")
              stats = {
                  "hn_raw": len(hn_rows),
                  "openai_raw": len(openai_items),
                  "qbitai_raw": len(qbitai_items),
                  "merged_raw": merged,
                  "after_url_dedup": deduped_total,
                  "selected": len(kept),
                  "dropped": max(0, merged - deduped_total),
                  "missing_sources": [
                      "%s(%d)" % (label, count)
                      for label, count in (("HN", len(hn_rows)), ("OpenAI Blog", len(openai_items)), ("量子位", len(qbitai_items)))
                      if count == 0
                  ],
                  "warnings": warnings,
                  "selected_by_source": {
                      origin: sum(1 for row in kept if (row.get("origin") or "?") == origin)
                      for origin in sorted({row.get("origin") or "?" for row in kept})
                  },
              }
              return {
                  "items": kept,
                  "items_json": json.dumps(kept, ensure_ascii=False),
                  "stats": json.dumps(stats, ensure_ascii=False),
                  "run_date": today_in_beijing(),
              }
