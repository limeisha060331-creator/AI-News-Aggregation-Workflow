        desc: 把 code_parse 的文章列表写成中文 Markdown 日报，分「今日头条 / 重要进展 / 值得关注 / 链接汇总」四档，每条给
          1-5 重要性评分。提示词唯一来源是 prompts/llm_daily_report_prompt.md，改完跑 tools/sync_llm_prompt.py
          同步。
        memory:
