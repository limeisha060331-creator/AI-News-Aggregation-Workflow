      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          data: ''
          type: none
        desc: 量子位 RSS。原机器之心 https://www.jiqizhixin.com/rss 已不再返回 RSS（返回网页），改用量子位。
        headers: ''
        method: get
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 15000
            multiplier: 2
          max_retries: 3
          retry_interval: 2000
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 抓取量子位
        type: http-request
        url: https://www.qbitai.com/feed
      height: 90
      id: http_qbitai
      position:
        x: 942
        y: 320
      positionAbsolute:
        x: 942
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\nDify 代码节点：解析 Hacker News API 返回的 JSON。\n\
          \n数据流\n    HTTP 请求节点（拉 HN 数据）-> 本节点（清洗 / 去重 / 格式化）-> 结构化列表\n\n输入\n    hn_json\
          \          : str | dict | list  HTTP 节点响应体，兼容 Algolia 与 Firebase 两种形状\n\
          \    tz_offset_hours  : float  输出时间的时区偏移，默认 8（北京时间 UTC+8）\n    time_format\
          \      : str    strftime 格式，默认 \"%Y-%m-%d %H:%M\"\n    max_items       \
          \ : int    最多保留多少条，0 表示不限制\n\n输出（对应 Dify 节点的输出变量）\n    stories       : list[dict]\
          \  每条必含 title / url / time / source，\n                                另附\
          \ id / author / score / comments / text / time_iso / time_unix\n    count\
          \         : int  列表长度\n    skipped       : int  因缺标题或结构非法被丢弃的条数\n    deduplicated\
          \  : int  被去重合并掉的条数\n    error         : str  解析失败原因，正常为空字符串\n\"\"\"\n\n\
          import json\nimport re\nfrom datetime import datetime, timedelta, timezone\n\
          from urllib.parse import parse_qsl, urlencode, urlsplit\n\n# ---------------------------------------------------------------------------\
          \ 常量\n\nHN_ITEM_URL = \"https://news.ycombinator.com/item?id={id}\"\nHN_FALLBACK_SOURCE\
          \ = \"Hacker News\"\nDEFAULT_TZ_OFFSET_HOURS = 8.0\nDEFAULT_TIME_FORMAT\
          \ = \"%Y-%m-%d %H:%M\"\nMAX_COLLECT_DEPTH = 4\n\n# 条目列表可能挂在这些字段下（按优先级）\n\
          _LIST_KEYS = (\"hits\", \"stories\", \"items\", \"results\", \"data\", \"\
          list\", \"articles\")\n\n_TITLE_KEYS = (\"title\", \"story_title\", \"name\"\
          , \"headline\")\n_URL_KEYS = (\"url\", \"story_url\", \"link\", \"permalink\"\
          , \"href\")\n_ID_KEYS = (\"id\", \"objectID\", \"object_id\", \"story_id\"\
          )\n_TIME_KEYS = (\n    \"time\",\n    \"created_at_i\",\n    \"timestamp\"\
          ,\n    \"published_at\",\n    \"published\",\n    \"date\",\n    \"created_at\"\
          ,\n)\n_AUTHOR_KEYS = (\"by\", \"author\", \"user\", \"username\")\n_SCORE_KEYS\
          \ = (\"score\", \"points\", \"votes\")\n_COMMENT_KEYS = (\"descendants\"\
          , \"num_comments\", \"comments_count\", \"comments\")\n_SOURCE_KEYS = (\"\
          source\", \"site\", \"publisher\", \"domain\")\n_TEXT_KEYS = (\"story_text\"\
          , \"text\", \"description\", \"summary\", \"content\")\n\n# 正文截断长度，供下游 LLM\
          \ 摘要有足够上下文又不超过提示词预算\nTEXT_LIMIT = 400\n\n# 去重时应当忽略的跟踪参数\n_TRACKING_PARAMS\
          \ = {\n    \"utm_source\", \"utm_medium\", \"utm_campaign\", \"utm_term\"\
          , \"utm_content\",\n    \"utm_id\", \"utm_name\", \"fbclid\", \"gclid\"\
          , \"igshid\", \"mc_cid\", \"mc_eid\",\n    \"ref\", \"ref_src\", \"spm\"\
          ,\n}\n\n_HOST_ALIASES = {\n    \"x.com\": \"twitter.com\",\n    \"mobile.twitter.com\"\
          : \"twitter.com\",\n    \"m.twitter.com\": \"twitter.com\",\n    \"old.reddit.com\"\
          : \"reddit.com\",\n    \"np.reddit.com\": \"reddit.com\",\n    \"www.reddit.com\"\
          : \"reddit.com\",\n}\n_HOST_PREFIXES = (\"www.\", \"m.\", \"mobile.\", \"\
          amp.\", \"web.\")\n\n_WHITESPACE_RE = re.compile(r\"\\s+\")\n_NUMERIC_RE\
          \ = re.compile(r\"^[+-]?\\d+(\\.\\d+)?([eE][+-]?\\d+)?$\")\n\n\n# -----------------------------------------------------------------------\
          \ 基础工具\n\n\ndef _as_text(value):\n    \"\"\"把任意 JSON 标量安全转成字符串；容器 / 布尔 /\
          \ None 一律视为空。\"\"\"\n    if value is None or isinstance(value, bool):\n\
          \        return \"\"\n    if isinstance(value, str):\n        return value\n\
          \    if isinstance(value, (int, float)):\n        return str(value)\n  \
          \  return \"\"\n\n\ndef _clean(value):\n    \"\"\"折叠空白并去掉首尾空格，用于净化 title\
          \ 之类的文本。\"\"\"\n    return _WHITESPACE_RE.sub(\" \", _as_text(value)).strip()\n\
          \n\ndef _first_present(item, keys):\n    \"\"\"按候选字段名顺序取第一个非空值。\"\"\"\n\
          \    if not isinstance(item, dict):\n        return \"\"\n    for key in\
          \ keys:\n        text = _clean(item.get(key))\n        if text:\n      \
          \      return text\n    return \"\"\n\n\ndef _to_int(value, default=None):\n\
          \    if value is None or isinstance(value, bool):\n        return default\n\
          \    if isinstance(value, int):\n        return value\n    if isinstance(value,\
          \ float):\n        return int(value)\n    text = _as_text(value).strip()\n\
          \    try:\n        return int(float(text))\n    except ValueError:\n   \
          \     return default\n\n\ndef _to_float(value, default=0.0):\n    if value\
          \ is None or isinstance(value, bool):\n        return default\n    if isinstance(value,\
          \ (int, float)):\n        return float(value)\n    text = _as_text(value).strip()\n\
          \    try:\n        return float(text)\n    except ValueError:\n        return\
          \ default\n\n\ndef _clip(text, limit=TEXT_LIMIT):\n    \"\"\"把正文截断到指定长度。\"\
          \"\"\n    return text[:limit] if text else \"\"\n\n\n# -----------------------------------------------------------------------\
          \ 时间处理\n\n\ndef _normalize_epoch(number):\n    \"\"\"把秒 / 毫秒 / 微秒 / 纳秒时间戳统一成秒。\"\
          \"\"\n    magnitude = abs(number)\n    if magnitude >= 1e17:      # 纳秒\n\
          \        return number / 1e9\n    if magnitude >= 1e14:      # 微秒\n    \
          \    return number / 1e6\n    if magnitude >= 1e11:      # 毫秒\n        return\
          \ number / 1e3\n    return number              # 秒\n\n\ndef _parse_iso_datetime(text):\n\
          \    candidate = text.strip()\n    if candidate.endswith((\"Z\", \"z\")):\n\
          \        candidate = candidate[:-1] + \"+00:00\"\n    try:\n        parsed\
          \ = datetime.fromisoformat(candidate)\n    except ValueError:\n        return\
          \ None\n    if parsed.tzinfo is None:          # 无时区信息时按 UTC 处理\n      \
          \  parsed = parsed.replace(tzinfo=timezone.utc)\n    try:\n        return\
          \ parsed.timestamp()\n    except (OSError, OverflowError, ValueError):\n\
          \        return None\n\n\ndef to_unix_seconds(value):\n    \"\"\"epoch 秒\
          \ / 毫秒、数字字符串、ISO8601 字符串统一成 Unix 秒；无法识别返回 None。\"\"\"\n    if value is None\
          \ or isinstance(value, bool):\n        return None\n    if isinstance(value,\
          \ (int, float)):\n        return _normalize_epoch(float(value))\n\n    text\
          \ = _as_text(value).strip()\n    if not text:\n        return None\n   \
          \ if _NUMERIC_RE.match(text):\n        return _normalize_epoch(float(text))\n\
          \    return _parse_iso_datetime(text)\n\n\ndef format_time(value, tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS,\
          \ time_format=DEFAULT_TIME_FORMAT):\n    \"\"\"把任意时间表示格式化成字符串；无法识别时返回空字符串。\"\
          \"\"\n    seconds = to_unix_seconds(value)\n    if seconds is None:\n  \
          \      return \"\"\n    tzinfo = timezone(timedelta(hours=_to_float(tz_offset_hours)))\n\
          \    try:\n        return datetime.fromtimestamp(seconds, tzinfo).strftime(time_format)\n\
          \    except (OSError, OverflowError, ValueError):\n        return \"\"\n\
          \n\ndef format_time_utc(value):\n    \"\"\"输出 UTC 的 ISO8601（秒级精度，带 Z），便于机器读取。\"\
          \"\"\n    seconds = to_unix_seconds(value)\n    if seconds is None:\n  \
          \      return \"\"\n    try:\n        moment = datetime.fromtimestamp(seconds,\
          \ timezone.utc)\n    except (OSError, OverflowError, ValueError):\n    \
          \    return \"\"\n    return moment.strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n\n\
          \n# ---------------------------------------------------------------------\
          \ URL 处理\n\n\ndef _normalize_host(host):\n    \"\"\"小写化主机名，去掉 www / m /\
          \ amp 之类前缀并做常见别名归一。\"\"\"\n    host = (host or \"\").lower()\n    for prefix\
          \ in _HOST_PREFIXES:\n        if host.startswith(prefix) and len(host) >\
          \ len(prefix):\n            host = host[len(prefix):]\n            break\n\
          \    return _HOST_ALIASES.get(host, host)\n\n\ndef host_of(url):\n    \"\
          \"\"从 URL 中取出用于展示的域名。\"\"\"\n    text = _clean(url)\n    if not text:\n\
          \        return \"\"\n    if \"//\" not in text.split(\"?\", 1)[0]:\n  \
          \      text = \"https://\" + text\n    return _normalize_host(urlsplit(text).hostname)\n\
          \n\ndef normalize_url(url):\n    \"\"\"归一化 URL 用于去重：小写主机、补全裸域名、去掉跟踪参数与尾斜杠。\"\
          \"\"\n    text = _clean(url)\n    if not text:\n        return \"\"\n  \
          \  if \"//\" not in text.split(\"?\", 1)[0]:\n        text = \"https://\"\
          \ + text\n    try:\n        parts = urlsplit(text)\n    except ValueError:\n\
          \        return text.lower().rstrip(\"/\")\n\n    host = _normalize_host(parts.hostname)\n\
          \    if not host:\n        return text.lower().rstrip(\"/\")\n\n    netloc\
          \ = host\n    try:\n        if parts.port:\n            netloc = \"%s:%d\"\
          \ % (host, parts.port)\n    except ValueError:\n        pass\n\n    path\
          \ = parts.path.rstrip(\"/\") or \"/\"\n    query = urlencode(\n        sorted(\n\
          \            (key, value)\n            for key, value in parse_qsl(parts.query,\
          \ keep_blank_values=True)\n            if key.lower() not in _TRACKING_PARAMS\n\
          \        )\n    )\n    normalized = netloc + path\n    if query:\n     \
          \   normalized += \"?\" + query\n    return normalized\n\n\ndef extract_source(raw_item,\
          \ url, synthesized=False):\n    \"\"\"\n    来源判定优先级：\n    1. 数据自带的 source\
          \ / site / domain 字段\n    2. 链接是本地合成的 HN 讨论页（文本贴、Ask HN）-> 记为 Hacker News\n\
          \    3. 链接域名\n    \"\"\"\n    explicit = _first_present(raw_item, _SOURCE_KEYS)\n\
          \    if explicit:\n        return explicit\n    if synthesized:\n      \
          \  return HN_FALLBACK_SOURCE\n    return host_of(url) or HN_FALLBACK_SOURCE\n\
          \n\n# --------------------------------------------------------------------\
          \ 条目构造\n\n\ndef build_story(raw_item, tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS,\
          \ time_format=DEFAULT_TIME_FORMAT):\n    \"\"\"把单条原始数据规范化；缺标题或无法生成链接时返回\
          \ None（丢弃）。\"\"\"\n    if not isinstance(raw_item, dict):\n        return\
          \ None\n\n    title = _first_present(raw_item, _TITLE_KEYS)\n    if not\
          \ title:\n        return None\n\n    item_id = _first_present(raw_item,\
          \ _ID_KEYS)\n    url = _first_present(raw_item, _URL_KEYS)\n    synthesized\
          \ = not url\n    if synthesized:\n        if not item_id:\n            return\
          \ None                     # 既没链接也没 id，无法生成可点击条目\n        url = HN_ITEM_URL.format(id=item_id)\n\
          \n    raw_time = _first_present(raw_item, _TIME_KEYS)\n    seconds = to_unix_seconds(raw_time)\n\
          \n    return {\n        \"title\": title,\n        \"url\": url,\n     \
          \   \"time\": format_time(raw_time, tz_offset_hours, time_format),\n   \
          \     \"source\": extract_source(raw_item, url, synthesized),\n        \"\
          id\": item_id,\n        \"author\": _first_present(raw_item, _AUTHOR_KEYS),\n\
          \        \"score\": _to_int(_first_present(raw_item, _SCORE_KEYS)),\n  \
          \      \"comments\": _to_int(_first_present(raw_item, _COMMENT_KEYS)),\n\
          \        \"text\": _clip(_first_present(raw_item, _TEXT_KEYS)),\n      \
          \  \"time_iso\": format_time_utc(raw_time),\n        \"time_unix\": int(seconds)\
          \ if seconds is not None else None,\n    }\n\n\ndef dedupe_key(story):\n\
          \    \"\"\"同一条新闻可能有多种链接形态，统一用归一化 URL 做键。\"\"\"\n    normalized = normalize_url(story[\"\
          url\"])\n    if normalized:\n        return \"url:\" + normalized\n    return\
          \ \"title:\" + _clean(story[\"title\"]).casefold()\n\n\ndef _merge_missing(target,\
          \ extra):\n    \"\"\"重复条目保留先出现的，只补齐 target 中缺失的字段。\"\"\"\n    # build_story\
          \ 保证 url 非空，这里同样按“先到先得”补齐其余字段\n    for field in (\"url\", \"time\", \"time_iso\"\
          , \"time_unix\", \"source\", \"id\", \"author\", \"score\", \"comments\"\
          ):\n        if target.get(field) in (None, \"\") and extra.get(field) not\
          \ in (None, \"\"):\n            target[field] = extra[field]\n\n\n# -----------------------------------------------------------------\
          \ 入口 / 主流程\n\n\ndef _loads(text):\n    try:\n        return json.loads(text)\n\
          \    except (ValueError, TypeError):\n        return None\n\n\ndef collect_items(payload,\
          \ depth=0):\n    \"\"\"从各种响应形状里取出条目列表。\"\"\"\n    if payload is None or\
          \ depth > MAX_COLLECT_DEPTH:\n        return []\n    if isinstance(payload,\
          \ str):\n        return collect_items(_loads(payload), depth + 1)\n    if\
          \ isinstance(payload, list):\n        return payload\n    if isinstance(payload,\
          \ dict):\n        for key in _LIST_KEYS:\n            if key in payload:\n\
          \                found = collect_items(payload[key], depth + 1)\n      \
          \          if found:\n                    return found\n        values =\
          \ list(payload.values())\n        if values and all(isinstance(value, dict)\
          \ for value in values):\n            return values                    #\
          \ {\"123\": {...}, \"456\": {...}} 形式\n        if any(key in payload for\
          \ key in _TITLE_KEYS + _URL_KEYS + _ID_KEYS):\n            return [payload]\
          \                 # 单个条目\n    return []\n\n\ndef parse_hn_json(\n    hn_json,\n\
          \    tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS,\n    time_format=DEFAULT_TIME_FORMAT,\n\
          \    max_items=0,\n):\n    \"\"\"核心逻辑：清洗 + 去重 + 时间格式化，返回 Dify 节点输出。\"\"\"\
          \n    limit = _to_int(max_items, 0) or 0\n    stories = []\n    index =\
          \ {}\n    skipped = 0\n    deduplicated = 0\n\n    for raw_item in collect_items(hn_json):\n\
          \        if limit and len(stories) >= limit:\n            break\n      \
          \  story = build_story(raw_item, tz_offset_hours, time_format)\n       \
          \ if story is None:\n            skipped += 1\n            continue\n  \
          \      key = dedupe_key(story)\n        existing = index.get(key)\n    \
          \    if existing is None:\n            index[key] = story\n            stories.append(story)\n\
          \        else:\n            deduplicated += 1\n            _merge_missing(existing,\
          \ story)\n\n    return {\n        \"stories\": stories,\n        \"count\"\
          : len(stories),\n        \"skipped\": skipped,\n        \"deduplicated\"\
          : deduplicated,\n        \"error\": \"\",\n    }\n\n\ndef main(\n    hn_json,\n\
          \    tz_offset_hours=DEFAULT_TZ_OFFSET_HOURS,\n    time_format=DEFAULT_TIME_FORMAT,\n\
          \    max_items=0,\n):\n    \"\"\"Dify 代码节点入口，保证不抛异常。\"\"\"\n    try:\n \
