    - data:
        code: "import datetime\nimport json\nimport re\nimport xml.etree.ElementTree\
          \ as ET\nfrom urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit\n\
          \nTOP_N = 15\nMIN_PER_SOURCE = 3\nATOM = \"{http://www.w3.org/2005/Atom}\"\
          \nDROP_KEYS = {\"ref\", \"fbclid\", \"gclid\", \"spm\", \"from\", \"source\"\
          , \"share_token\"}\nENTITIES = (\n    (\"&nbsp;\", \" \"), (\"&amp;\", \"\
          &\"), (\"&lt;\", \"<\"),\n    (\"&gt;\", \">\"), (\"&quot;\", '\"'), (\"\
          &#39;\", \"'\"),\n)\n\n\ndef normalize_url(raw: str) -> str:\n    if not\
          \ raw:\n        return \"\"\n    raw = raw.strip()\n    try:\n        parts\
          \ = urlsplit(raw)\n    except Exception:\n        return raw\n    host =\
          \ (parts.hostname or \"\").lower()\n    if not host:\n        return raw\n\
          \    query = []\n    for key, value in parse_qsl(parts.query, keep_blank_values=False):\n\
          \        low = key.lower()\n        if low.startswith(\"utm_\") or low in\
          \ DROP_KEYS:\n            continue\n        query.append((key, value))\n\
          \    path = parts.path.rstrip(\"/\") or \"/\"\n    return urlunsplit((\"\
          https\", host, path, urlencode(query), \"\"))\n\n\ndef clean_text(value)\
          \ -> str:\n    text = value or \"\"\n    text = re.sub(r\"<[^>]+>\", \"\
          \ \", text)\n    for src, dst in ENTITIES:\n        text = text.replace(src,\
          \ dst)\n    return re.sub(r\"\\s+\", \" \", text).strip()\n\n\ndef looks_like_html(body:\
          \ str) -> bool:\n    \"\"\"feed 地址失效时常常返回一个网页，这里用来识别这种情况。\"\"\"\n    head\
          \ = (body or \"\").strip()[:200].lower()\n    return head.startswith(\"\
          <!doctype html\") or head.startswith(\"<html\")\n\n\ndef parse_rss(xml_text:\
          \ str, source: str, weight: int) -> list:\n    items = []\n    if not xml_text:\n\
          \        return items\n    try:\n        root = ET.fromstring(xml_text.strip())\n\
          \    except Exception:\n        return items\n    for node in root.iter(\"\
          item\"):\n        title = clean_text(node.findtext(\"title\"))\n       \
          \ link = (node.findtext(\"link\") or \"\").strip()\n        if not title\
          \ or not link:\n            continue\n        items.append({\n         \
          \   \"title\": title,\n            \"url\": link,\n            \"origin\"\
          : source,\n            \"weight\": weight,\n            \"score\": 0,\n\
          \            \"published\": (node.findtext(\"pubDate\") or \"\").strip(),\n\
          \            \"raw\": clean_text(node.findtext(\"description\"))[:400],\n\
          \        })\n    for node in root.iter(ATOM + \"entry\"):\n        title\
          \ = clean_text(node.findtext(ATOM + \"title\"))\n        link_node = node.find(ATOM\
          \ + \"link\")\n        link = link_node.get(\"href\") if link_node is not\
          \ None else \"\"\n        if not title or not link:\n            continue\n\
          \        items.append({\n            \"title\": title,\n            \"url\"\
          : link.strip(),\n            \"origin\": source,\n            \"weight\"\
          : weight,\n            \"score\": 0,\n            \"published\": (node.findtext(ATOM\
          \ + \"updated\") or \"\").strip(),\n            \"raw\": clean_text(node.findtext(ATOM\
          \ + \"summary\"))[:400],\n        })\n    return items\n\n\ndef map_hn(stories:\
          \ list) -> list:\n    \"\"\"把 code_hn 节点输出的结构化列表映射成内部条目结构。\"\"\"\n    items\
          \ = []\n    for row in stories or []:\n        if not isinstance(row, dict):\n\
          \            continue\n        title = clean_text(row.get(\"title\"))\n\
          \        url = (row.get(\"url\") or \"\").strip()\n        if not title\
          \ or not url:\n            continue\n        items.append({\n          \
          \  \"title\": title,\n            \"url\": url,\n            \"origin\"\
          : \"HN\",\n            \"weight\": 3,\n            \"score\": int(row.get(\"\
          score\") or 0),\n            \"published\": row.get(\"time_iso\") or row.get(\"\
          time\") or \"\",\n            \"raw\": clean_text(row.get(\"text\"))[:400],\n\
          \        })\n    return items\n\n\ndef pick_top(rows: list) -> list:\n \
          \   \"\"\"按来源限额挑选，避免单个源把版面刷满；名额之外再用高分条目补满。\"\"\"\n    origins = {row.get(\"\
          origin\") or \"?\" for row in rows}\n    cap = max(MIN_PER_SOURCE, TOP_N\
          \ // max(1, len(origins)))\n    picked, overflow, used = [], [], {}\n  \
          \  for row in rows:\n        origin = row.get(\"origin\") or \"?\"\n   \
          \     if used.get(origin, 0) < cap:\n            used[origin] = used.get(origin,\
          \ 0) + 1\n            picked.append(row)\n        else:\n            overflow.append(row)\n\
          \    picked.extend(overflow[: max(0, TOP_N - len(picked))])\n    return\
          \ picked[:TOP_N]\n\n\ndef today_in_beijing() -> str:\n    \"\"\"日报日期统一按北京时间算，避免用\
          \ UTC 跑出前一天。\"\"\"\n    now = datetime.datetime.now(datetime.timezone.utc)\
          \ + datetime.timedelta(hours=8)\n    return now.strftime(\"%Y-%m-%d\")\n\
          \n\ndef main(hn_items: list, openai_body: str, qbitai_body: str, history_urls:\
          \ str) -> dict:\n    hn_rows = map_hn(hn_items)\n    openai_items = parse_rss(openai_body,\
          \ \"OpenAI Blog\", 5)\n    qbitai_items = parse_rss(qbitai_body, \"量子位\"\
          , 4)\n\n    blocked = set()\n    for line in (history_urls or \"\").splitlines():\n\
          \        key = normalize_url(line)\n        if key:\n            blocked.add(key)\n\
          \n    kept = []\n    seen = set()\n    for item in hn_rows + openai_items\
          \ + qbitai_items:\n        key = normalize_url(item[\"url\"])\n        if\
          \ not key or key in seen or key in blocked:\n            continue\n    \
          \    seen.add(key)\n        item[\"url\"] = key\n        kept.append(item)\n\
          \n    kept.sort(key=lambda row: (row[\"weight\"], row[\"score\"]), reverse=True)\n\
          \    deduped_total = len(kept)\n    kept = pick_top(kept)\n    for index,\
          \ item in enumerate(kept):\n        item[\"index\"] = index\n\n    merged\
          \ = len(hn_rows) + len(openai_items) + len(qbitai_items)\n    warnings =\
          \ []\n    for label, body in ((\"OpenAI Blog\", openai_body), (\"量子位\",\
          \ qbitai_body)):\n        if looks_like_html(body):\n            warnings.append(label\
          \ + \" 返回的是网页不是 RSS，feed 地址可能已经失效\")\n    stats = {\n        \"hn_raw\"\
          : len(hn_rows),\n        \"openai_raw\": len(openai_items),\n        \"\
          qbitai_raw\": len(qbitai_items),\n        \"merged_raw\": merged,\n    \
          \    \"after_url_dedup\": deduped_total,\n        \"selected\": len(kept),\n\
          \        \"dropped\": max(0, merged - deduped_total),\n        \"missing_sources\"\
          : [\n            \"%s(%d)\" % (label, count)\n            for label, count\
          \ in ((\"HN\", len(hn_rows)), (\"OpenAI Blog\", len(openai_items)), (\"\
          量子位\", len(qbitai_items)))\n            if count == 0\n        ],\n    \
          \    \"warnings\": warnings,\n        \"selected_by_source\": {\n      \
          \      origin: sum(1 for row in kept if (row.get(\"origin\") or \"?\") ==\
          \ origin)\n            for origin in sorted({row.get(\"origin\") or \"?\"\
          \ for row in kept})\n        },\n    }\n    return {\n        \"items\"\
          : kept,\n        \"items_json\": json.dumps(kept, ensure_ascii=False),\n\
          \        \"stats\": json.dumps(stats, ensure_ascii=False),\n        \"run_date\"\
          : today_in_beijing(),\n    }\n"
        code_language: python3
        desc: ''
