    - data:
        code: "import datetime\nimport re\n\n# 分档标题：出现两个以上才认为模型真的按格式写了日报\nSECTION_KEYWORDS\
          \ = (\"今日头条\", \"重要进展\", \"值得关注\", \"链接汇总\")\n\n# 抓日报里的链接：markdown 链接、<url>、裸链接都能命中\n\
          URL_RE = re.compile(r\"https?://[^\\s)\\]>（），。；、\\\"']+\")\n# 末尾的反斜杠是模型在\
          \ markdown 里转义右括号留下的（.../ \\)），不剥掉会污染去重 key\nTRAILING_CHARS = \".,;:!?、。；：！？\\\
          \\\"\n\nFALLBACK_TOP_N = 12\n\n\ndef strip_wrappers(text: str) -> str:\n\
          \    \"\"\"丢掉推理块、HTML 注释，以及模型给整篇日报套上的 markdown 围栏。\"\"\"\n    body = (text\
          \ or \"\").strip()\n    body = re.sub(r\"(?is)<think>.*?</think>\", \" \"\
          , body)\n    body = re.sub(r\"(?is)<!--.*?-->\", \" \", body)\n    body\
          \ = body.strip()\n    if body.startswith(\"```\"):\n        body = re.sub(r\"\
          ^```[a-zA-Z]*[ \\t]*\\r?\\n\", \"\", body)\n        body = re.sub(r\"\\\
          r?\\n?```[ \\t]*$\", \"\", body)\n    # 模型常把链接写成 [原文](https://.../\\)，转义出来的反斜杠会让链接点开\
          \ 404\n    body = re.sub(r\"(https?://[^\\s)]*?)\\\\\\)\", r\"\\1)\", body)\n\
          \    return body.strip()\n\n\ndef extract_urls(markdown: str) -> list:\n\
          \    \"\"\"按出现顺序取出日报引用到的链接，重复的只保留一次。\"\"\"\n    seen, urls = set(), []\n\
          \    for raw in URL_RE.findall(markdown or \"\"):\n        url = raw.rstrip(TRAILING_CHARS)\n\
          \        if url and url not in seen:\n            seen.add(url)\n      \
          \      urls.append(url)\n    return urls\n\n\ndef looks_like_report(markdown:\
          \ str) -> bool:\n    \"\"\"模型写了分档日报，而不是报错、道歉或者 JSON。\"\"\"\n    if not markdown.strip()\
          \ or not extract_urls(markdown):\n        return False\n    return sum(1\
          \ for word in SECTION_KEYWORDS if word in markdown) >= 2\n\n\ndef today_in_beijing()\
          \ -> str:\n    now = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)\n\
          \    return now.strftime(\"%Y-%m-%d\")\n\n\ndef importance_of(row: dict)\
          \ -> int:\n    \"\"\"保底渲染时没有 LLM 评分，用来源权重当重要性近似值。\"\"\"\n    try:\n    \
          \    weight = int(row.get(\"weight\") or 3)\n    except (TypeError, ValueError):\n\
          \        weight = 3\n    return min(5, max(1, weight))\n\n\ndef fallback_markdown(items:\
          \ list, run_date: str, reason: str) -> str:\n    \"\"\"LLM 输出不可用时用 code_parse\
          \ 的结果拼保底日报，宁可朴素也不能推空消息。\"\"\"\n    rows = [row for row in (items or [])\
          \ if isinstance(row, dict) and row.get(\"url\")]\n    rows.sort(key=lambda\
          \ row: (row.get(\"weight\") or 0, row.get(\"score\") or 0), reverse=True)\n\
          \    rows = rows[:FALLBACK_TOP_N]\n\n    sources = \" / \".join(sorted({row.get(\"\
          origin\") or \"\" for row in rows if row.get(\"origin\")}))\n    lines =\
          \ [\n        \"# AI 日报 · \" + run_date,\n        \"\",\n        \"> 共 %d\
          \ 条 · 来源：%s\" % (len(rows), sources or \"无\"),\n        \"\",\n        \"\
          <!-- 保底渲染（%s）：LLM 这次没给出可用的日报正文 -->\" % reason,\n        \"\",\n    ]\n \
          \   for name, group in ((\"今日头条\", rows[:1]), (\"重要进展\", rows[1:3]), (\"\
          值得关注\", rows[3:])):\n        lines.append(\"## \" + name)\n        lines.append(\"\
          \")\n        if not group:\n            lines.append(\"今日无\")\n        \
          \    lines.append(\"\")\n            continue\n        for row in group:\n\
          \            lines.append(\"### %s · 重要性 %d/5\" % (row.get(\"title\") or\
          \ \"(无标题)\", importance_of(row)))\n            lines.append((row.get(\"\
          raw\") or \"\").strip() or \"（摘要缺失，仅保留标题与链接）\")\n            lines.append(\"\
          来源：%s · [原文](%s)\" % (row.get(\"origin\") or \"\", row.get(\"url\")))\n\
          \            lines.append(\"\")\n    lines.append(\"## 链接汇总\")\n    lines.append(\"\
          \")\n    for row in rows:\n        lines.append(\"- [%s](%s) — %s · %d/5\"\
          \ % (\n            row.get(\"title\") or \"(无标题)\", row.get(\"url\"), row.get(\"\
          origin\") or \"\", importance_of(row),\n        ))\n    return \"\\n\".join(lines).strip()\n\
          \n\ndef main(llm_markdown: str, items: list, run_date: str = \"\") -> dict:\n\
          \    date = (run_date or \"\").strip() or today_in_beijing()\n\n    report\
          \ = strip_wrappers(llm_markdown)\n    if not looks_like_report(report):\n\
          \        reason = \"输出为空\" if not report else \"输出不是分档日报\"\n        report\
          \ = fallback_markdown(items, date, reason)\n\n    urls = extract_urls(report)\n\
          \    # 让链接回到 code_parse 的归一化形式：跨天去重就是拿这个 key 比对的，\n    # 模型多写一个尾斜杠，第二天就会把同一条再推一遍。\n\
          \    canonical = {}\n    for row in items or []:\n        if isinstance(row,\
          \ dict) and row.get(\"url\"):\n            canonical[row[\"url\"].rstrip(\"\
          /\")] = row[\"url\"]\n    urls = list(dict.fromkeys(canonical.get(url.rstrip(\"\
          /\"), url) for url in urls))\n    if not urls:\n        urls = [row.get(\"\
          url\") for row in (items or []) if isinstance(row, dict) and row.get(\"\
          url\")]\n\n    return {\n        \"markdown\": report,\n        \"pushed_urls\"\
          : urls,\n        \"count\": len(urls),\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          count:
            children: null
            type: number
          markdown:
            children: null
            type: string
          pushed_urls:
            children: null
