app:
  description: 从 Hacker News、OpenAI Blog、量子位三个源抓取 AI 资讯，去重后由 LLM 生成中文日报 Markdown（今日头条/重要进展/值得关注，每条带
    1-5 重要性评分）并推送。
  icon: 📰
  icon_background: '#EFF1F4'
  icon_type: emoji
  mode: workflow
  name: AI 资讯聚合日报
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.24@9e12eef09973667f0eaf4f082af883167e1de88740b22e71e71488d020c3778a
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: edge-start-hn
      source: start_node
      sourceHandle: source
      target: http_hn
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: edge-hn-codehn
      source: http_hn
      sourceHandle: source
      target: code_hn
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: edge-codehn-openai
      source: code_hn
      sourceHandle: source
      target: http_openai
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: http-request
      id: edge-openai-qbitai
      source: http_openai
      sourceHandle: source
      target: http_qbitai
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: edge-qbitai-parse
      source: http_qbitai
      sourceHandle: source
      target: code_parse
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: edge-parse-llm
      source: code_parse
      sourceHandle: source
      target: llm_sum
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: edge-llm-build
      source: llm_sum
      sourceHandle: source
      target: code_build
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: edge-build-end
      source: code_build
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 入参 history_urls 由外部传入最近已推送的 URL（每行一个），用于跨天去重；留空则只做当天去重。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 已推送URL列表
          max_length: 20000
          options: []
          required: false
          type: paragraph
          variable: history_urls
      height: 90
      id: start_node
      position:
        x: 30
        y: 320
      positionAbsolute:
        x: 30
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          data: ''
          type: none
        desc: Hacker News 首页当前 30 条（front_page），Algolia 一次返回整个列表，不需要循环。
        headers: ''
        method: get
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 15000
            multiplier: 2
          max_retries: 3
          retry_interval: 2000
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 抓取 HN
        type: http-request
        url: https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30
      height: 90
      id: http_hn
      position:
        x: 334
        y: 320
      positionAbsolute:
        x: 334
        y: 320
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          type: no-auth
        body:
          data: ''
          type: none
        desc: OpenAI 官方博客 RSS。若返回 404，改成 https://openai.com/blog/rss.xml
        headers: ''
        method: get
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 15000
            multiplier: 2
          max_retries: 3
          retry_interval: 2000
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 抓取 OpenAI Blog
        type: http-request
        url: https://openai.com/news/rss.xml
      height: 90
      id: http_openai
      position:
        x: 638
        y: 320
